<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<title>InstaNews · 印思新聞</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F3;
    --ink: #1A1815;
    --ink-soft: #4A4642;
    --ink-mute: #8B847C;
    --paper: #FFFFFF;
    --rule: #E8E3DA;
    --gold: #B08B4F;
    --accent-finance: #2B4C7E;
    --accent-tech: #6B4226;
    --accent-tw: #8B2C2C;
    --serif: 'Noto Serif TC', 'Songti TC', '宋體', serif;
    --sans: 'Noto Sans TC', -apple-system, 'PingFang TC', '微軟正黑體', sans-serif;
    --shadow-card: 0 1px 2px rgba(26,24,21,0.04), 0 8px 24px rgba(26,24,21,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* subtle paper texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(176, 139, 79, 0.025) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(43, 76, 126, 0.02) 0%, transparent 50%);
    z-index: 0;
  }

  .app {
    position: relative;
    height: 100dvh;
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    z-index: 1;
  }

  /* ===== Header ===== */
  header {
    padding: 18px 24px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .masthead {
    font-family: var(--serif);
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: var(--ink);
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .masthead .brand-en {
    font-family: var(--serif);
    letter-spacing: 0.02em;
  }
  .masthead .brand-zh {
    font-size: 13px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .masthead .dot {
    color: var(--gold);
    font-weight: 400;
  }

  .icon-btn {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--ink-soft);
    transition: color 0.2s, transform 0.2s;
  }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn .heart-filled { display: none; color: var(--accent-tw); }
  .icon-btn.has-favs .heart-filled { display: block; }
  .icon-btn.has-favs .heart-empty { display: none; }

  /* ===== Topic tabs ===== */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 14px 20px 10px;
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    background: transparent;
    border: none;
    padding: 8px 4px 10px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-mute);
    cursor: pointer;
    position: relative;
    transition: color 0.25s;
    letter-spacing: 0.05em;
  }
  .tab .emoji { font-size: 15px; margin-right: 4px; }
  .tab::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 0;
    height: 2px;
    background: currentColor;
    transition: width 0.3s ease, left 0.3s ease;
  }
  .tab.active { color: var(--ink); font-weight: 700; }
  .tab.active::after { width: 28px; left: calc(50% - 14px); }

  .tab[data-topic="global_finance"].active { color: var(--accent-finance); }
  .tab[data-topic="tech"].active { color: var(--accent-tech); }
  .tab[data-topic="taiwan_business"].active { color: var(--accent-tw); }

  /* ===== Stage (card area) ===== */
  .stage {
    flex: 1;
    position: relative;
    padding: 8px 20px 20px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  .card {
    position: absolute;
    inset: 8px 20px 20px;
    background: var(--paper);
    border-radius: 14px;
    padding: 32px 26px 26px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-card);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.32s ease, transform 0.32s ease;
    pointer-events: none;
    overflow: hidden;
  }
  .card.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .card.exit-up {
    opacity: 0;
    transform: translateY(-30px);
  }
  .card.exit-down {
    opacity: 0;
    transform: translateY(30px);
  }

  /* small accent line at top of card */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 32px;
    width: 32px;
    height: 3px;
    background: var(--gold);
  }
  .card[data-topic="global_finance"]::before { background: var(--accent-finance); }
  .card[data-topic="tech"]::before { background: var(--accent-tech); }
  .card[data-topic="taiwan_business"]::before { background: var(--accent-tw); }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--ink-mute);
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }
  .card-meta .sep {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--ink-mute);
    opacity: 0.5;
  }

  .card-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 24px;
    line-height: 1.35;
    letter-spacing: -0.005em;
    color: var(--ink);
    margin-bottom: 20px;
    padding-right: 32px; /* 留空間給右上愛心 */
  }

  .card-divider {
    width: 24px;
    height: 1px;
    background: var(--rule);
    margin-bottom: 18px;
  }

  .card-content {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.75;
    color: var(--ink-soft);
    flex: 1;
    letter-spacing: 0.005em;
  }

  .card-footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.05em;
  }
  .card-source {
    font-weight: 500;
  }
  /* 卡片愛心按鈕（固定在右上角） */
  .card-fav-btn {
    position: absolute;
    top: 22px;
    right: 22px;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px;
    display: grid;
    place-items: center;
    color: var(--ink-mute);
    transition: color 0.2s, transform 0.15s;
    z-index: 2;
  }
  .card-fav-btn:hover { color: var(--accent-tw); }
  .card-fav-btn:active { transform: scale(0.85); }
  .card-fav-btn svg { width: 20px; height: 20px; }
  .card-fav-btn .heart-filled { display: none; color: var(--accent-tw); }
  .card.favorited .card-fav-btn .heart-empty { display: none; }
  .card.favorited .card-fav-btn .heart-filled { display: block; }
  /* 收藏動畫 */
  @keyframes heartPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .card-fav-btn.just-faved { animation: heartPop 0.3s ease-out; }

  /* ===== Bottom indicator ===== */
  .indicator {
    padding: 12px 24px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    font-family: var(--serif);
    font-size: 12px;
    color: var(--ink-mute);
    letter-spacing: 0.1em;
  }
  .indicator .dots {
    display: flex;
    gap: 4px;
  }
  .indicator .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--rule);
    transition: background 0.25s, width 0.25s;
  }
  .indicator .dot.active {
    background: var(--ink);
    width: 14px;
    border-radius: 2px;
  }
  .hint {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.08em;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(26, 24, 21, 0.92);
    color: #fff;
    padding: 12px 22px;
    border-radius: 22px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* ===== Favorites modal ===== */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(26, 24, 21, 0.35);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 50;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .modal.show { opacity: 1; pointer-events: auto; }

  .modal-sheet {
    width: 100%;
    max-width: 460px;
    max-height: 80vh;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    padding: 24px 0 env(safe-area-inset-bottom);
    transform: translateY(100%);
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .modal.show .modal-sheet { transform: translateY(0); }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px 16px;
    border-bottom: 1px solid var(--rule);
  }
  .modal-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.05em;
  }
  .modal-list {
    overflow-y: auto;
    padding: 8px 0;
    flex: 1;
  }
  .modal-list .empty {
    text-align: center;
    padding: 60px 24px;
    color: var(--ink-mute);
    font-size: 14px;
    line-height: 1.8;
  }
  .modal-item {
    padding: 14px 24px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: background 0.2s;
  }
  .modal-item:hover, .modal-item:active { background: rgba(0,0,0,0.03); }
  .modal-item:last-child { border-bottom: none; }
  .modal-item-topic {
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .modal-item-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
  }

  /* ===== Loading ===== */
  .loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--ink-mute);
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 0.15em;
  }

  /* ===== 延伸閱讀按鈕（卡片右下角） ===== */
  .card-ext-btn {
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 16px;
    padding: 6px 12px 6px 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .card-ext-btn:hover, .card-ext-btn:active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .card-ext-btn svg { width: 13px; height: 13px; }
  .card-ext-btn.disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .card-ext-btn.disabled:hover {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--rule);
  }

  /* ===== 延伸卡 Overlay ===== */
  .ext-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 24, 21, 0.55);
    backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.3s, visibility 0s linear 0.3s;
    z-index: 60;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .ext-overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transition: opacity 0.3s, visibility 0s;
  }

  .ext-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px 12px;
    max-width: 460px;
    width: 100%;
    margin: 0 auto;
  }
  .ext-header-title {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.95);
    letter-spacing: 0.12em;
  }
  .ext-close {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 50%;
    color: #fff;
    cursor: pointer;
    transition: background 0.2s;
  }
  .ext-close:hover { background: rgba(255,255,255,0.2); }
  .ext-close svg { width: 18px; height: 18px; }

  .ext-stage {
    flex: 1;
    position: relative;
    padding: 8px 20px 20px;
    max-width: 460px;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  .ext-card {
    position: absolute;
    inset: 8px 20px 20px;
    background: var(--paper);
    border-radius: 14px;
    padding: 32px 26px 26px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translateX(20px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    overflow: hidden;
  }
  .ext-card.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }
  .ext-card.exit-left { opacity: 0; transform: translateX(-30px); }
  .ext-card.exit-right { opacity: 0; transform: translateX(30px); }

  .ext-card::before {
    content: "";
    position: absolute;
    top: 0; left: 32px;
    width: 32px;
    height: 3px;
    background: var(--gold);
  }
  .ext-card[data-type="context"]::before { background: var(--accent-finance); }
  .ext-card[data-type="player"]::before { background: var(--accent-tech); }
  .ext-card[data-type="number"]::before { background: var(--accent-tw); }
  .ext-card[data-type="history"]::before { background: var(--gold); }

  .ext-card-tag {
    display: inline-block;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 14px;
  }

  .ext-card-title {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 20px;
    line-height: 1.4;
    color: var(--ink);
    margin-bottom: 18px;
  }

  .ext-card-divider {
    width: 24px;
    height: 1px;
    background: var(--rule);
    margin-bottom: 18px;
  }

  .ext-card-content {
    font-family: var(--sans);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.75;
    color: var(--ink-soft);
    flex: 1;
  }

  .ext-card-footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.05em;
  }

  .ext-indicator {
    padding: 12px 24px 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    max-width: 460px;
    width: 100%;
    margin: 0 auto;
    color: rgba(255,255,255,0.85);
  }
  .ext-indicator .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: background 0.25s, width 0.25s;
  }
  .ext-indicator .dot.active {
    background: rgba(255,255,255,1);
    width: 16px;
    border-radius: 3px;
  }

  /* 收藏列表的放大鏡按鈕 */
  .modal-item-wrap {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--rule);
    transition: background 0.2s;
  }
  .modal-item-wrap:last-child { border-bottom: none; }
  .modal-item-wrap:hover, .modal-item-wrap:active { background: rgba(0,0,0,0.03); }
  .modal-item-wrap .modal-item {
    flex: 1;
    border-bottom: none;
    padding: 14px 8px 14px 24px;
  }
  .modal-item-wrap .modal-item:hover,
  .modal-item-wrap .modal-item:active { background: transparent; }
  .modal-item-zoom {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    margin-right: 18px;
    display: grid;
    place-items: center;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 50%;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .modal-item-zoom:hover, .modal-item-zoom:active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .modal-item-zoom.disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .modal-item-zoom.disabled:hover {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--rule);
  }
  .modal-item-zoom svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="masthead"><span class="brand-en">InstaNews</span> <span class="dot">·</span> <span class="brand-zh">印思新聞</span></div>
    <button class="icon-btn" id="favBtn" aria-label="收藏">
      <svg class="heart-empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5L12 21l7-7z"/>
      </svg>
      <svg class="heart-filled" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5L12 21l7-7z"/>
      </svg>
    </button>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <main class="stage" id="stage">
    <div class="loading">載入中⋯</div>
  </main>

  <div class="indicator">
    <div class="dots" id="dots"></div>
    <div class="hint" id="hint">上下滑切換</div>
  </div>
</div>


<div class="ext-overlay" id="extOverlay">
  <div class="ext-header">
    <div class="ext-header-title">延伸閱讀</div>
    <button class="ext-close" id="extClose" aria-label="關閉延伸閱讀">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="ext-stage" id="extStage"></div>
  <div class="ext-indicator" id="extIndicator"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title">收藏 <span id="favCount" style="color: var(--ink-mute); font-weight: 400; font-size: 14px; margin-left: 6px;"></span></div>
      <button class="icon-btn" id="closeModal" aria-label="關閉">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

<script>
  // ============ State ============
  let DATA = null;
  let currentTopicIdx = 0;
  let currentCardIdx = 0;
  let favorites = JSON.parse(localStorage.getItem('newscard_favs') || '[]');

  const stage = document.getElementById('stage');

  function renderTabs() {

          <svg class="heart-filled" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5L12 21l7-7z"/>

      el.innerHTML = `

      const favCardBtn = el.querySelector('.card-fav-btn');

        toggleFavorite(card.id, el);
        if (!wasFav) {
          favCardBtn.classList.add('just-faved');
          setTimeout(() => favCardBtn.classList.remove('just-faved'), 350);
        }
      });
      favCardBtn.addEventListener('mousedown', e => e.stopPropagation());
      favCardBtn.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
      // 延伸按鈕點擊（不要被 long-press 影響）
      const extBtn = el.querySelector('.card-ext-btn');
      if (extBtn && hasExt) {
        extBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openExtensions(card);
        });
        // 防止長按延伸按鈕變成收藏
        extBtn.addEventListener('mousedown', e => e.stopPropagation());

  function renderDots() {
    const topic = DATA.topics[currentTopicIdx];
    dots.innerHTML = '';
    topic.cards.forEach((_, i) => {
      const d = document.createElement('span');
      d.className = 'dot' + (i === currentCardIdx ? ' active' : '');
      dots.appendChild(d);

  // ============ Navigation ============
  // 記住每個主題上次停在哪張
  const topicLastIdx = {};

  function switchTopic(idx, fromSwipe = false) {
    if (idx < 0 || idx >= DATA.topics.length || idx === currentTopicIdx) return;
    // 存下目前主題的進度
    topicLastIdx[currentTopicIdx] = currentCardIdx;
    currentTopicIdx = idx;
    // 還原新主題上次的進度（沒記錄過就從 0 開始）
    currentCardIdx = topicLastIdx[idx] || 0;
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
    renderCards();
  }

  function nextCard() {
    const cards = DATA.topics[currentTopicIdx].cards;
    if (currentCardIdx >= cards.length - 1) {
      bounce('down');
      return;
    }
    transitionCard(currentCardIdx, currentCardIdx + 1, 'up');
    currentCardIdx++;
    renderDots();
  }

  function prevCard() {
    if (currentCardIdx <= 0) {
      bounce('up');
      return;
    }
    transitionCard(currentCardIdx, currentCardIdx - 1, 'down');
    currentCardIdx--;
    renderDots();
  }

  function transitionCard(fromIdx, toIdx, dir) {
    const cards = stage.querySelectorAll('.card');
    cards[fromIdx].classList.remove('active');
    cards[fromIdx].classList.add(dir === 'up' ? 'exit-up' : 'exit-down');
    setTimeout(() => {
      cards[toIdx].classList.remove('exit-up', 'exit-down');
      cards[toIdx].classList.add('active');
      setTimeout(() => {
        cards[fromIdx].classList.remove('exit-up', 'exit-down');
      }, 320);
    }, 50);
  }

  function bounce(dir) {
    const active = stage.querySelector('.card.active');
    if (!active) return;
    active.style.transition = 'transform 0.2s ease-out';
    active.style.transform = dir === 'up' ? 'translateY(8px)' : 'translateY(-8px)';
    setTimeout(() => {
      active.style.transform = 'translateY(0)';
      setTimeout(() => { active.style.transition = ''; }, 200);
    }, 150);
  }

  // ============ Gestures ============
  let touchStart = null;
  let touchEnd = null;

  stage.addEventListener('touchstart', e => {
    if (document.getElementById('extOverlay').classList.contains('show')) return;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
    touchEnd = null;
  }, { passive: true });

  stage.addEventListener('touchmove', e => {
    touchEnd = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });

  stage.addEventListener('touchend', e => {
    if (!touchStart || !touchEnd) return;
    const dx = touchEnd.x - touchStart.x;
    const dy = touchEnd.y - touchStart.y;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    const elapsed = Date.now() - touchStart.t;

    // ignore long touches (those are handled as long-press)
    if (elapsed > 600 && absDx < 30 && absDy < 30) return;

    const threshold = 40;
    if (absDy > absDx && absDy > threshold) {
      // vertical swipe
      if (dy < 0) nextCard();
      else prevCard();
    } else if (absDx > absDy && absDx > threshold) {
      // horizontal swipe = switch topic
      if (dx < 0) switchTopic(currentTopicIdx + 1);
      else switchTopic(currentTopicIdx - 1);
    }
    touchStart = null;
    touchEnd = null;
  });

  // Wheel for desktop (垂直＝切卡、水平＝切主題)
  let wheelLock = false;
  stage.addEventListener('wheel', e => {
    if (document.getElementById('extOverlay').classList.contains('show')) return;
    if (wheelLock) return;
    const absX = Math.abs(e.deltaX);
    const absY = Math.abs(e.deltaY);
    // 取主要方向
    if (absX > absY && absX > 20) {
      wheelLock = true;
      if (e.deltaX > 0) switchTopic(currentTopicIdx + 1);
      else switchTopic(currentTopicIdx - 1);
      setTimeout(() => { wheelLock = false; }, 400);
    } else if (absY > 20) {
      wheelLock = true;
      if (e.deltaY > 0) nextCard();
      else prevCard();
      setTimeout(() => { wheelLock = false; }, 400);
    }
  }, { passive: true });

  // 滑鼠拖曳橫向滑動（桌機觸控板沒有水平滾動的人也能用）
  let mouseDragStart = null;
  stage.addEventListener('mousedown', e => {
    if (document.getElementById('extOverlay').classList.contains('show')) return;
    // 不干擾長按收藏：只記錄起始點，後面靠移動距離判斷是否為拖曳
    mouseDragStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  stage.addEventListener('mouseup', e => {
    if (!mouseDragStart) return;
    const dx = e.clientX - mouseDragStart.x;
    const dy = e.clientY - mouseDragStart.y;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    const elapsed = Date.now() - mouseDragStart.t;
    mouseDragStart = null;
    // 短時間 + 夠長距離 = 拖曳手勢
    if (elapsed > 600) return;
    if (absDx > 60 && absDx > absDy) {
      if (dx < 0) switchTopic(currentTopicIdx + 1);
      else switchTopic(currentTopicIdx - 1);
    } else if (absDy > 60 && absDy > absDx) {
      if (dy < 0) nextCard();
      else prevCard();
    }
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    const extEl = document.getElementById('extOverlay');
    // 延伸卡開著時，主畫面不接收快捷鍵
    if (extEl && extEl.classList.contains('show')) return;
    // 收藏 modal 開著時也跳過（除了 ESC）
    if (modal.classList.contains('show')) {
      if (e.key === 'Escape') closeFavModal();
      return;
    }
    if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); nextCard(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); prevCard(); }
    else if (e.key === 'ArrowRight') switchTopic(currentTopicIdx + 1);
    else if (e.key === 'ArrowLeft') switchTopic(currentTopicIdx - 1);
    else if (e.key === 'Escape') closeFavModal();
  });

  // ============ Long press to favorite ============
  function attachLongPress(el, card) {
    let timer = null;
    let pressed = false;
    const start = (e) => {
      pressed = true;
      timer = setTimeout(() => {
        if (pressed) {
          toggleFavorite(card.id, el);
          if (navigator.vibrate) navigator.vibrate(20);
        }
      }, 500);
    };
    const cancel = () => {
      pressed = false;
      if (timer) { clearTimeout(timer); timer = null; }
    };
    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('touchmove', cancel);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);
  }

  function toggleFavorite(id, el) {
    const i = favorites.indexOf(id);
    if (i >= 0) {
      favorites.splice(i, 1);
      el.classList.remove('favorited');
      showToast('已移除收藏');
    } else {
      favorites.push(id);
      el.classList.add('favorited');
      showToast('♥ 已收藏');
    }
    localStorage.setItem('newscard_favs', JSON.stringify(favorites));
    updateFavBadge();
  }

  function isFavorited(id) { return favorites.includes(id); }

  function updateFavBadge() {
    favBtn.classList.toggle('has-favs', favorites.length > 0);
  }

  // ============ Toast ============
  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  function openFavModal() {

    modal.classList.add('show');
  }
  function closeFavModal() { modal.classList.remove('show'); }

  function renderFavList() {
    favCount.textContent = favorites.length > 0 ? `(${favorites.length})` : '';
    if (favorites.length === 0) {
      modalList.innerHTML = '<div class="empty">還沒有收藏的新聞<br>長按卡片即可收藏</div>';
      return;
    }
    modalList.innerHTML = '';
    const all = [];
    DATA.topics.forEach((t, ti) => {
      t.cards.forEach((c, ci) => {
        if (favorites.includes(c.id)) all.push({ topic: t, topicIdx: ti, card: c, cardIdx: ci });
      });
    });
    all.sort((a, b) => favorites.indexOf(b.card.id) - favorites.indexOf(a.card.id));
    all.forEach(item => {
      const hasExt = item.card.extensions && item.card.extensions.length > 0;
      const wrap = document.createElement('div');
      wrap.className = 'modal-item-wrap';
      wrap.innerHTML = `
        <div class="modal-item">
          <div class="modal-item-topic">${item.topic.emoji} ${item.topic.name}</div>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>

          </svg>

      wrap.querySelector('.modal-item').onclick = () => {
        currentTopicIdx = item.topicIdx;
        currentCardIdx = item.cardIdx;
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === item.topicIdx));
        renderCards();
        closeFavModal();
      };
      // 點放大鏡 → 直接開延伸卡
      const zoomBtn = wrap.querySelector('.modal-item-zoom');
      zoomBtn.onclick = (e) => {
        e.stopPropagation();
        if (hasExt) {
          closeFavModal();
          setTimeout(() => openExtensions(item.card), 200);
        } else {
          showToast('這張卡的延伸內容尚未生成');
        }
      };
      modalList.appendChild(wrap);
    });
  }

  // ============ Utils ============
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

    number: '數字解讀',
    history: '歷史對照'
  };

  function openExtensions(card) {
    if (!card.extensions || card.extensions.length === 0) return;
    currentExt = { card, idx: 0 };
    renderExtCards();
    extOverlay.classList.add('show');
  }

  function closeExtensions() {
    extOverlay.classList.remove('show');
    // 等淡出動畫結束再清空，避免閃爍
    setTimeout(() => {
      currentExt = null;
      extStage.innerHTML = '';
    }, 320);
  }

  function renderExtCards() {
    if (!currentExt) return;
    extStage.innerHTML = '';
    currentExt.card.extensions.forEach((ext, i) => {
      const el = document.createElement('article');
      el.className = 'ext-card' + (i === currentExt.idx ? ' active' : '');
      el.dataset.type = ext.type;
      el.innerHTML = `
        <div class="ext-card-tag">${TYPE_LABELS[ext.type] || ext.type}</div>
        <h2 class="ext-card-title">${escapeHtml(ext.title)}</h2>
        <div class="ext-card-divider"></div>
        <p class="ext-card-content">${escapeHtml(ext.content)}</p>
        <div class="ext-card-footer">${escapeHtml(ext.source_note || '')}</div>
      `;
      extStage.appendChild(el);
    });
    renderExtIndicator();
  }

  function renderExtIndicator() {
    if (!currentExt) return;
    extIndicator.innerHTML = '';
    currentExt.card.extensions.forEach((_, i) => {
      const d = document.createElement('span');
      d.className = 'dot' + (i === currentExt.idx ? ' active' : '');
      extIndicator.appendChild(d);
    });
  }

  function extNext() {
    if (!currentExt) return;
    if (currentExt.idx >= currentExt.card.extensions.length - 1) return;
    const oldIdx = currentExt.idx;
    currentExt.idx++;
    transitionExtCard(oldIdx, currentExt.idx, 'left');
    renderExtIndicator();
  }
  function extPrev() {
    if (!currentExt) return;
    if (currentExt.idx <= 0) return;
    const oldIdx = currentExt.idx;
    currentExt.idx--;
    transitionExtCard(oldIdx, currentExt.idx, 'right');
    renderExtIndicator();
  }
  function transitionExtCard(fromIdx, toIdx, dir) {
    const cards = extStage.querySelectorAll('.ext-card');
    cards[fromIdx].classList.remove('active');
    cards[fromIdx].classList.add(dir === 'left' ? 'exit-left' : 'exit-right');
    setTimeout(() => {
      cards[toIdx].classList.remove('exit-left', 'exit-right');
      cards[toIdx].classList.add('active');
      setTimeout(() => {
        cards[fromIdx].classList.remove('exit-left', 'exit-right');
      }, 300);
    }, 50);
  }

  // 關閉
  extClose.addEventListener('click', closeExtensions);
  extOverlay.addEventListener('click', (e) => {
    // 點背景遮罩關閉（但不要點到 card 本身關閉）
    if (e.target === extOverlay) closeExtensions();
  });

  // ESC 關閉
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && extOverlay.classList.contains('show')) {
      closeExtensions();
    } else if (extOverlay.classList.contains('show')) {
      if (e.key === 'ArrowRight') { e.preventDefault(); extNext(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); extPrev(); }
    }
  });

  // 延伸卡手勢：左右滑切延伸卡
  let extTouchStart = null;
  let extTouchEnd = null;
  extStage.addEventListener('touchstart', e => {
    extTouchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
    extTouchEnd = null;
  }, { passive: true });
  extStage.addEventListener('touchmove', e => {
    extTouchEnd = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  extStage.addEventListener('touchend', e => {
    if (!extTouchStart || !extTouchEnd) return;
    const dx = extTouchEnd.x - extTouchStart.x;
    const dy = extTouchEnd.y - extTouchStart.y;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    if (absDx > absDy && absDx > 40) {
      if (dx < 0) extNext();
      else extPrev();
    } else if (absDy > absDx && absDy > 60) {
      // 下滑可關閉
      if (dy > 0) closeExtensions();
    }
    extTouchStart = null;
    extTouchEnd = null;
  });

  // 桌機左右滑（觸控板水平 / 滾輪）
  let extWheelLock = false;
  extStage.addEventListener('wheel', e => {
    if (extWheelLock) return;
    const absX = Math.abs(e.deltaX);
    const absY = Math.abs(e.deltaY);
    if (absX > absY && absX > 20) {
      extWheelLock = true;
      if (e.deltaX > 0) extNext();
      else extPrev();
      setTimeout(() => { extWheelLock = false; }, 400);
    }
  }, { passive: true });

  // 滑鼠拖曳
  let extMouseDrag = null;
  extStage.addEventListener('mousedown', e => {
    extMouseDrag = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  extStage.addEventListener('mouseup', e => {
    if (!extMouseDrag) return;
    const dx = e.clientX - extMouseDrag.x;
    const absDx = Math.abs(dx);
    const elapsed = Date.now() - extMouseDrag.t;
    extMouseDrag = null;
    if (elapsed > 600) return;
    if (absDx > 60) {
      if (dx < 0) extNext();
      else extPrev();
    }
  });

  function formatDate(d) {
    if (!d) return '';
    const parts = d.split('-');
    if (parts.length === 3) {
      // 2026.04.29
      return `${parts[0]}.${parts[1]}.${parts[2]}`;
    } else if (parts.length === 2) {
      // 2026.04　（補空白讓寬度跟到日的版本對齊）
      return `${parts[0]}.${parts[1]}`;
    }
    return d;
  }
</script>
</body>
